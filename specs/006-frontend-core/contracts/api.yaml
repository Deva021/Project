openapi: 3.0.0
info:
  title: Frontend Core Backend API Consumption
  version: 1.0.0
  description: API contract definitions for endpoints consumed by the Frontend Core components.
servers:
  - url: /backend
    description: Backend API Server (relative path)

paths:
  /api/health:
    get:
      summary: Health Check
      operationId: getHealthStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK

  /api/conversations:
    get:
      summary: List Conversations
      operationId: listConversations
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: tenantId
          schema:
            type: string
            format: uuid
          required: true
          description: Filter conversations by tenant ID
      responses:
        '200':
          description: A list of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
    post:
      summary: Create Conversation
      operationId: createConversation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: string
                  format: uuid
                title:
                  type: string
                message:
                  type: string
              required:
                - tenant_id
                - message
      responses:
        '200':
          description: Created conversation and initial message
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation:
                    $ref: '#/components/schemas/Conversation'
                  initialMessage:
                    $ref: '#/components/schemas/Message'

  /api/conversations/{conversationId}/messages:
    get:
      summary: Get Message History
      operationId: getMessageHistory
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
            format: uuid
          required: true
          description: ID of the conversation
      responses:
        '200':
          description: A list of messages for the conversation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
    post:
      summary: Send Message
      operationId: sendMessage
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
            format: uuid
          required: true
          description: ID of the conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                sender_type:
                  type: string
                  enum: [visitor, agent]
                sender_id:
                  type: string
                  format: uuid
              required:
                - text
                - sender_type
      responses:
        '200':
          description: Sent message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /api/conversations/{conversationId}/status:
    put:
      summary: Update Conversation Status
      operationId: updateConversationStatus
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
            format: uuid
          required: true
          description: ID of the conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
              required:
                - status
      responses:
        '204':
          description: Status updated successfully
        '400':
          description: Invalid request body

  /api/poll:
    get:
      summary: Poll for New Messages/Events
      operationId: pollForEvents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: New messages or events
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object # Placeholder for various event types

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        senderType:
          type: string
          enum: [visitor, agent]
        text:
          type: string
        createdAt:
          type: string
          format: date-time

openapi: 3.0.0
info:
  title: Core Chat REST API
  version: "1.0.0"
  description: "Core REST API for the chat application, including health checks, conversation and message management, and real-time polling."

paths:
  /health:
    get:
      summary: Health Check
      description: Provides a simple health check endpoint to verify the operational status of the backend.
      responses:
        '200':
          description: System is operational.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"

  /conversations:
    get:
      summary: List Tenant Conversations
      description: Retrieves a list of conversations for the authenticated user's tenant.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of conversations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
    post:
      summary: Create Conversation
      description: Creates a new public conversation.
      requestBody:
        description: Initial data for the new conversation.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: "Optional title for the conversation."
                visitor_name:
                  type: string
                  description: "Name of the visitor starting the conversation."
      responses:
        '201':
          description: Conversation created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          description: Bad Request.

  /messages:
    get:
      summary: Fetch Message History
      description: Retrieves the message history for a given conversation.
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of messages.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Conversation not found.
    post:
      summary: Send Message
      description: Sends a message to a conversation. Can be used by public visitors or authenticated agents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conversationId:
                  type: string
                  format: uuid
                content:
                  type: string
      responses:
        '201':
          description: Message sent successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Bad Request.

  /poll:
    get:
      summary: Poll for Real-time Events
      description: A long-polling endpoint to receive real-time events for the client.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: An array of real-time events.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object # A generic object, as the event structure is not defined in this spec
        '401':
          description: Unauthorized.
        '204':
          description: No content, timeout reached without new events.

components:
  schemas:
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        title:
          type: string
        created_at:
          type: string
          format: date-time
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: string
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

openapi: 3.0.3
info:
  title: Chat Business Logic API
  version: 1.0.0
  description: API for managing chat conversations and messages.

paths:
  /api/conversations:
    get:
      summary: List conversations for a tenant
      description: (Protected) Retrieves a paginated list of conversations for the authenticated agent's tenant.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of conversations.
    post:
      summary: Create a new conversation
      description: (Public) Creates a new conversation, typically initiated by a visitor's first message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                initialMessage:
                  type: string
      responses:
        '201':
          description: Conversation created successfully.

  /api/conversations/{conversationId}/messages:
    get:
      summary: Get message history
      description: (Public/Protected) Retrieves the message history for a specific conversation.
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of messages.
    post:
      summary: Send a message
      description: (Public/Protected) Sends a message to a specific conversation.
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
      responses:
        '201':
          description: Message sent successfully.

  /api/conversations/{conversationId}/status:
    put:
      summary: Update conversation status
      description: (Protected) Updates the status of a conversation (e.g., to 'CLOSED').
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [OPEN, ACTIVE, PENDING, CLOSED]
      responses:
        '200':
          description: Status updated successfully.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
